.g-proj{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
.g-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.g-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.g-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.g-2sm{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g-pump{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g-motor{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.tbl-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px;}
.tbl-wrap::-webkit-scrollbar{height:5px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:#bbf7d0;border-radius:3px;}
.tab-bar-wrap{display:flex;gap:4px;padding-top:4px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tab-bar-wrap::-webkit-scrollbar{display:none;}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.sum-bar{display:flex;flex-wrap:wrap;gap:14px;}

.formula-fab{
  position:fixed;bottom:80px;right:16px;z-index:1000;
  background:linear-gradient(135deg,#15803d,#166534);
  color:white;border:none;border-radius:14px;
  padding:10px 14px;cursor:pointer;
  box-shadow:0 4px 18px rgba(21,128,61,0.45);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  line-height:1.3;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif;
  transition:transform 0.15s,box-shadow 0.15s;
}
.formula-fab:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(21,128,61,0.55);}

.pwa-install-fab{
  position:fixed;bottom:16px;right:16px;z-index:1100;
  background:linear-gradient(135deg,#1d4ed8 0%,#1e3a8a 100%);
  color:white;border:none;border-radius:14px;
  padding:10px 14px;cursor:pointer;
  box-shadow:0 4px 20px rgba(29,78,216,0.55);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  line-height:1.3;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif;
  transition:transform 0.15s,box-shadow 0.15s;
  animation:pwaFabPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes pwaFabPop{
  from{opacity:0;transform:scale(0.5) rotate(-15deg);}
  to{opacity:1;transform:scale(1) rotate(0deg);}
}
.pwa-install-fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 28px rgba(29,78,216,0.70);}
.pwa-install-fab:active{transform:scale(0.96);}
.pwa-install-fab-badge{
  position:absolute;top:-7px;right:-7px;
  background:#ef4444;color:white;font-size:11px;font-weight:900;
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid white;
  animation:badgePing 2s ease-in-out infinite;
}
@keyframes badgePing{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,0.6);}
  50%{transform:scale(1.15);box-shadow:0 0 0 5px rgba(239,68,68,0);}
}

.fml-overlay{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;}
.fml-box{background:white;border-radius:18px;max-width:740px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.3);display:flex;flex-direction:column;}
.fml-head{background:linear-gradient(135deg,#15803d,#166534);color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.fml-body{overflow-y:auto;padding:20px 22px;-webkit-overflow-scrolling:touch;}
.fml-body::-webkit-scrollbar{width:6px;}
.fml-body::-webkit-scrollbar-thumb{background:#bbf7d0;border-radius:3px;}
.fml-sec{margin-bottom:22px;}
.fml-sec-title{font-size:12px;font-weight:800;color:#15803d;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px;display:flex;align-items:center;gap:6px;border-left:3px solid #16a34a;padding-left:8px;}
.fml-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.fml-eq{font-family:'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace;font-size:13px;font-weight:700;color:#15803d;background:#f0fdf4;border-radius:6px;padding:6px 10px;margin:6px 0;display:block;word-break:break-all;}
.fml-note{font-size:11px;color:#6b7280;margin-top:4px;line-height:1.7;}

.fml-itabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-shrink:0;background:rgba(0,0,0,.20);}
.fml-itabs::-webkit-scrollbar{display:none;}
.fml-itab{padding:9px 16px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:11.5px;font-weight:700;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .15s;flex-shrink:0;}
.fml-itab:hover:not(.on){color:rgba(255,255,255,.88);}
.fml-itab.on{color:#fff;border-bottom-color:#4ade80;}
.fml-panel{display:none;}
.fml-panel.on{display:block;}
